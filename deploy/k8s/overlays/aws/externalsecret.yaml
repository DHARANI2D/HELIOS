# helios-secrets, kept in AWS Secrets Manager as one JSON secret named
# helios/production with these keys: DATABASE_URL (helios_app),
# OWNER_DATABASE_URL (helios_owner), AUTH_SECRET, HELIOS_ENCRYPTION_KEY_KMS
# (or HELIOS_ENCRYPTION_KEY), ANTHROPIC_API_KEY (optional), SEED_ADMIN_EMAIL,
# SEED_ADMIN_PASSWORD. Needs the External Secrets Operator and a
# ClusterSecretStore named aws-secrets-manager (docs/deployment.md).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: helios-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: helios-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: helios/production
