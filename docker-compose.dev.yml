# Postgres only, for `npm run dev` on your machine (DATABASE_URL in .env:
# postgresql://helios:helios@localhost:5432/helios). To run all of HELIOS in
# containers instead, use docker-compose.yml (docs/deployment.md).
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios
      POSTGRES_DB: helios
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-dev-data:
